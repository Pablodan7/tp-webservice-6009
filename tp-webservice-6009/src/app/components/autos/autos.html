<div class="container-fluid bg-dark text-white p-4 min-vh-100">

  <h1 class="text-center mb-5">🚗 Marcas de Autos</h1>

  <div class="row">
    <div class="col-md-3 mb-3" *ngFor="let marca of marcas">
      <div class="card bg-secondary text-white p-3 h-100">
        <h5>{{ marca.name || marca }}</h5>
        <button
          class="btn btn-light mt-3"
          data-bs-toggle="modal"
          data-bs-target="#modalModelos"
          (click)="verModelos(marca.name || marca)">
          Ver modelos
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalModelos" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5 class="modal-title">Modelos de {{ marcaSeleccionada }}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul class="list-group">
          <li class="list-group-item" *ngFor="let modelo of modelos">
            {{ modelo.name || modelo }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
